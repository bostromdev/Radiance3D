name: Firmware

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

jobs:
  native-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install "platformio>=6.1,<7"
      - name: Build native simulator
        working-directory: firmware/controller
        run: pio run -e native
      - name: Test motion and protocol behavior
        working-directory: firmware/controller
        run: pio test -e native
