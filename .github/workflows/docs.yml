name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path CHANGELOG.md "./**/*.md"
          fail: true
