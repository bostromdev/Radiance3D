[platformio]
default_envs = native

[env]
build_flags =
  -D RADIANCE3D_PROTOCOL_VERSION=1
build_src_filter = +<*.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  ${env.build_flags}
  -std=c++14

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; The esp32dev target is the Version 1 firmware baseline; the exact board revision
; and GPIO mapping remain pending validation against the installed hardware.
