[platformio]
default_envs = native

[env]
build_flags =
  -D RADIANCE3D_PROTOCOL_VERSION=1
build_src_filter = +<*.cpp>

[env:native]
platform = native
test_framework = unity

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; esp32dev is a provisional compile target, not a supported board or pinout.
